# Render Blueprint — optional: Dashboard → New → Blueprint → connect repo with this file
services:
  - type: web
    name: oneway-dropme
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: BOOKING_EMAIL_TO
        value: dropme@gmail.com
      - key: BOOKING_EMAIL_FROM
        sync: false
